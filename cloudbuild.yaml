steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/qmodels/qmodels-api:$COMMIT_SHA'
      - '.'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/qmodels/qmodels-api:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'qmodels-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/qmodels/qmodels-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '16Gi'
      - '--cpu'
      - '4'
      - '--cpu-boost'
      - '--timeout'
      - '900'
      - '--concurrency'
      - '1'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/qmodels/qmodels-api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY